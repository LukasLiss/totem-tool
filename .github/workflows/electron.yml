name: electron

# Builds the desktop app (PyInstaller backend + Vite frontend + Electron shell)
# for Windows (x64), macOS Apple Silicon (arm64) and macOS Intel (x64).
#
# The PyInstaller backend is single-architecture, so each macOS flavour is
# built on a runner of that architecture (macos-14 = arm64, macos-15-intel = x64).
# macos-13 was retired in Dec 2025; GitHub drops Intel macOS runners in fall 2027.
#
# Signing / notarization is optional: when the secrets below are not set the
# build produces unsigned artifacts (fine for testing, not for distribution).
#   macOS:   CSC_LINK (base64 .p12), CSC_KEY_PASSWORD, APPLE_ID,
#            APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
#            (or electron-builder's azureSignOptions for Azure Trusted Signing)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            build-script: build-all
          - os: macos-14
            name: macos-arm64
            build-script: build-all-mac
          - os: macos-15-intel
            name: macos-x64
            build-script: build-all-mac

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix frontend
          npm ci --prefix electron

      # The build scripts (scripts/run-python.js) expect the venv at
      # backend/.venv. Use the venv's own interpreter for every install
      # instead of "activate" (which is a no-op for later steps).
      - name: Create Python venv and install backend (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements.txt
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
          backend/.venv/bin/python -m pip install -e totem_lib

      - name: Create Python venv and install backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv backend\.venv
          backend\.venv\Scripts\python.exe -m pip install --upgrade pip
          backend\.venv\Scripts\python.exe -m pip install -r backend\requirements.txt
          backend\.venv\Scripts\python.exe -m pip install -r backend\requirements-dev.txt
          backend\.venv\Scripts\python.exe -m pip install -e totem_lib

      - name: Build application
        run: npm run ${{ matrix.build-script }}
        env:
          # macOS code signing + notarization (electron-builder reads these).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode (PFX). Leave unset for an unsigned build.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Without a certificate electron-builder must not go looking for
          # one in the keychain (an unsigned build is the intended outcome).
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: totem-tool-${{ matrix.name }}
          if-no-files-found: error
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest*.yml

  release:
    name: Attach artifacts to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Both macOS jobs write a latest-mac.yml (the electron-updater feed), so
      # flattening the artifacts would keep only one. Merge their file lists:
      # arm64 Macs pick the "arm64" entries, Intel Macs the others. The
      # top-level path/sha512 stay on the x64 zip (legacy fallback).
      - name: Collect artifacts and merge latest-mac.yml
        run: |
          mkdir release-artifacts
          find artifacts -type f ! -name latest-mac.yml -exec cp {} release-artifacts/ \;
          python3 - <<'EOF'
          from pathlib import Path

          def split(path):
              parts = {"head": [], "files": [], "tail": []}
              section = "head"
              for line in Path(path).read_text().splitlines():
                  if line == "files:":
                      section = "files"
                      continue
                  if section == "files" and not line.startswith(" "):
                      section = "tail"
                  parts[section].append(line)
              return parts

          x64 = split("artifacts/totem-tool-macos-x64/latest-mac.yml")
          arm64 = split("artifacts/totem-tool-macos-arm64/latest-mac.yml")
          merged = x64["head"] + ["files:"] + x64["files"] + arm64["files"] + x64["tail"]
          Path("release-artifacts/latest-mac.yml").write_text("\n".join(merged) + "\n")
          EOF

          # Version-free copies, so a website can link to
          # .../releases/latest/download/<name> without updating it per
          # release. The versioned files stay: electron-updater uses them.
          cd release-artifacts
          cp TOTeM-Tool-Setup-*.exe TOTeM-Tool-Windows-x64.exe
          cp TOTeM-Tool-*-arm64.dmg TOTeM-Tool-macOS-AppleSilicon.dmg
          cp TOTeM-Tool-*-x64.dmg TOTeM-Tool-macOS-Intel.dmg
          cd ..
          ls -la release-artifacts
          cat release-artifacts/latest-mac.yml

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-artifacts/*
