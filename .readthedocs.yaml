# Read the Docs build for the totem-lib documentation in totem_lib/docs.
# Paths are relative to the repository root.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    # Totem.visualize() needs the Graphviz "dot" program.
    - graphviz
  jobs:
    post_checkout:
      # Skip pull request builds that do not change the library or this file.
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] && git diff --quiet origin/main -- totem_lib/ .readthedocs.yaml;
        then
          exit 183;
        fi

sphinx:
  configuration: totem_lib/docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: totem_lib
      extra_requirements:
        - docs
