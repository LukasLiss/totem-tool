[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "totem_lib"
version = "0.0.1"
authors = [
  { name="Example Author", email="author@example.com" },
]
description = "Library for the TOTeM paper"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "graphviz>=0.21",
    "networkx>=3.4.2",
    "polars>=1.32.2",
    "PuLP>=3.3.0",
    "pm4py>=2.7.17.1",
    "pyarrow>=21.0.0",
    "matplotlib>=3.10.0",
    "cvxopt>=1.3.0",
    "tqdm>=4.60.0",
    "duckdb>=1.0.0",
    "ijson>=3.2.0",
    "scipy>=1.11",
]

[project.urls]
"Homepage" = "https://github.com/LukasLiss/totem-tool"
"Bug Tracker" = "https://github.com/LukasLiss/totem-tool/issues"

[project.optional-dependencies]
test = [
    "pytest",
]
dev = [
    "pytest",
    "black>=24.0",
    "ruff>=0.5",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
# Black owns formatting; Ruff is used as a linter / import sorter only.
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
# E501 (line length) is handled by Black.
ignore = ["E501"]
