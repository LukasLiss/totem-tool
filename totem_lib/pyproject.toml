[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "totem-lib"
version = "0.1.0"
authors = [
  { name = "Lukas Liss", email = "liss@pads.rwth-aachen.de" },
]
description = "Object-centric process mining: OCEL 2.0 import, TOTeM temporal-object-type relations, process areas, OC-DFG, OCPN, OCCN"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "process mining",
    "object-centric",
    "OCEL",
    "OCEL 2.0",
    "TOTeM",
    "process areas",
    "OC-DFG",
    "OCPN",
    "OCCN",
    "conformance checking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "graphviz>=0.21",
    "networkx>=3.4.2",
    "polars>=1.32.2",
    "PuLP>=3.3.0",
    "pm4py>=2.7.17.1",
    "pyarrow>=21.0.0",
    "matplotlib>=3.10.0",
    "cvxopt>=1.3.0",
    "tqdm>=4.60.0",
    "duckdb>=1.0.0",
    "ijson>=3.2.0",
    "scipy>=1.12",
]

[project.urls]
"Homepage" = "https://github.com/LukasLiss/totem-tool"
"Source" = "https://github.com/LukasLiss/totem-tool/tree/main/totem_lib"
"Bug Tracker" = "https://github.com/LukasLiss/totem-tool/issues"

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
